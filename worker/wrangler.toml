name = "ascii-tree-gifts"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Set to your GitHub Pages origin, e.g. "https://<user>.github.io". Use "*" only for testing.
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "ascii-tree-gifts"
# Replace with the id printed by `npx wrangler d1 create ascii-tree-gifts`.
database_id = "00000000-0000-0000-0000-000000000000"
